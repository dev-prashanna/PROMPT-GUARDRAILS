training:
  output_dir: "checkpoints"
  seed: 42
  deterministic: true

  hyperparameters:
    learning_rate: 2.0e-5
    weight_decay: 0.01
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    max_grad_norm: 1.0
    warmup_ratio: 0.1
    lr_scheduler_type: "cosine"

  training_loop:
    num_train_epochs: 10
    per_device_train_batch_size: 8
    per_device_eval_batch_size: 16
    gradient_accumulation_steps: 8
    effective_batch_size: 64
    fp16: false
    bf16: true
    dataloader_num_workers: 2
    dataloader_pin_memory: true
    optim: "adamw_torch"

  early_stopping:
    enabled: true
    patience: 3
    min_delta: 0.001
    monitor: "macro_f1"
    mode: "max"

  checkpointing:
    save_strategy: "epoch"
    save_total_limit: 3
    load_best_model_at_end: true
    metric_for_best_model: "macro_f1"
    greater_is_better: true

  logging:
    logging_dir: "logs"
    logging_steps: 10
    report_to: ["tensorboard"]
    run_name: "deberta-v3-firewall"
    log_level: "info"

  reproducibility:
    seed: 42
    cudnn_deterministic: true
    cudnn_benchmark: false
    torch_backends_cudnn_deterministic: true

  gradient_checkpointing:
    enabled: true
    use_reentrant: false

  validation:
    eval_strategy: "epoch"
    eval_delay: 0
    predict_with_generate: false
